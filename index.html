<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
    :root {
    --bd-violet-rgb: 113, 44, 249;
    --meili-blue: #50a7f9;
    --light-blue: #eaf5ff;
    --light-gray: #f8f9fa;
    }

  .container-wrapper {
    display: flex;
    min-height: 100vh;
  }
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .right-panel {
    width: 0;
    overflow: hidden;
    background-color: var(--light-gray);
    border-left: 1px solid #dee2e6;
    transition: width 0.3s ease-in-out;
  }
  .right-panel.show {
    width: 300px;
  }
  .panel-content {
    width: 300px;
    padding: 1rem;
  }
      
  /* Chat interface styles */
  .chat-container {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .message {
    padding: 0.75rem;
    border-radius: 0.5rem;
    max-width: 80%;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .message-timestamp {
    position: absolute;
    bottom: 0.25rem;
    right: 0.5rem;
    font-size: 0.7rem !important;
    opacity: 0.7;
  }
  .message.user {
    align-self: flex-end;
    background-color: #007bff;
    color: white;
  }
  .message.user .message-timestamp {
    color: rgba(255,255,255,0.8) !important;
  }
  .message.assistant {
    align-self: flex-start;
    background-color: #f0f0f0;
    color: #333;
  }
  .message.system {
    align-self: center;
    background-color: #ffc107;
    color: #333;
    font-style: italic;
    font-size: 0.9rem;
  }
  .message.tool {
    align-self: flex-start;
    background-color: var(--light-blue);
    color: #333;
    border: 1px solid var(--meili-blue);
    max-width: 90%;
  }
  .chat-input {
    padding: 1rem;
    border-top: 1px solid #dee2e6;
  }

  .bd-navbar {
      padding: .75rem 0;
      /* background-color: transparent; */
      background-image: linear-gradient(rgba(var(--bd-violet-rgb), 1), rgba(var(--bd-violet-rgb), .95));
      box-shadow: 0 .5rem 1rem #00000026, inset 0 -1px #ffffff26;
  }
      
  /* Search results styling */
  .search-results {
    width: 100%;
    background-color: var(--light-gray);
    border-radius: 0.5rem;
    padding: 1rem;
    margin-bottom: 0.5rem;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .search-results h6 {
    color: var(--meili-blue);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .search-results .list-group-item {
    padding: 0.75rem;
    margin-bottom: 0.25rem;
    border-radius: 0.25rem;
    transition: background-color 0.2s;
  }
  .search-results .list-group-item:hover {
    background-color: rgba(80, 167, 249, 0.1);
  }
    
  /* Tool calls styling */
  .tool-calls-container {
    background-color: #f8f9fa;
    border-radius: 0.5rem;
    padding: 0.75rem;
    margin-top: 0.5rem;
    border: 1px dashed #dee2e6;
  }
  .tool-call {
    margin-bottom: 0.5rem;
  }
  .tool-name {
    font-weight: bold;
    color: var(--meili-blue);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  </head>

  <body>
    <div class="container-wrapper">
      <div class="main-content">
        <nav class="navbar bd-navbar" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">OpenAI Chat</a>
                <button class="btn btn-outline-light" type="button" onclick="togglePanel()">
                    Toggle Panel
                </button>
            </div>
        </nav>

        <div class="container-fluid p-4 flex-grow-1">
          <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be inserted here by JavaScript -->
                    <div class="message system">
                      Welcome to OpenAI Chat! How can I help you today? I can intercept specific tool calls.
                    </div>
                  </div>
            <div class="chat-input">
              <form id="chatForm">
                <div class="input-group">
                  <input type="text" id="userInput" class="form-control" placeholder="Type your message here..." autocomplete="off">
                  <button class="btn btn-primary" type="submit">
                    <i class="bi bi-send"></i> Send
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="right-panel" id="rightPanel">
        <div class="panel-content">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Settings</h4>
            <button type="button" class="btn-close" aria-label="Close" onclick="togglePanel()"></button>
          </div>
          <hr>
          <div class="mb-3">
            <h6>API Configuration</h6>
            <div class="mb-3">
              <label for="apiKeyInput" class="form-label">OpenAI API Key</label>
              <input type="password" class="form-control" id="apiKeyInput" placeholder="sk-...">
              <div class="form-text">Your API key is stored locally and never sent to our servers.</div>
            </div>
            <div class="mb-3">
              <label for="modelSelect" class="form-label">Model</label>
              <select class="form-select" id="modelSelect">
                <option value="gpt-4-turbo">GPT-4 Turbo</option>
                <option value="gpt-4">GPT-4</option>
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
              </select>
            </div>
          </div>
          <hr>

          <hr>
          <div class="d-grid gap-2">
            <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
            <button class="btn btn-outline-secondary" id="clearSettingsBtn">Clear Settings</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { OpenAIClient, openaiTools } from './openai-client.js';

      // DOM Elements
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const chatMessages = document.getElementById('chatMessages');
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const modelSelect = document.getElementById('modelSelect');

      // Client instances
      let openaiClient;
      let conversationHistory = [];

      // Initialize the app
      function initApp() {
        loadSettings();
        setupEventListeners();
        initializeClients();
        conversationHistory = [];
      }

      // Load settings from localStorage
      function loadSettings() {
        const settings = JSON.parse(localStorage.getItem('dialogueSettings') || '{}');
        apiKeyInput.value = settings.apiKey || '';
        modelSelect.value = settings.model || 'gpt-4-turbo';
      }

      // Save settings to localStorage
      function saveSettings() {
        const apiKey = apiKeyInput.value.trim();
        
        // Validate API key format
        if (!apiKey.startsWith('sk-') || apiKey.length < 20) {
          appendMessage('system', 'Invalid OpenAI API key format. API keys should start with "sk-" and be at least 20 characters long.');
          return;
        }
        
        const settings = {
          apiKey: apiKey,
          model: modelSelect.value
        };
        localStorage.setItem('dialogueSettings', JSON.stringify(settings));
        initializeClients();
        appendMessage('system', 'Settings saved successfully! You can now start chatting.');
      }

      // Initialize clients with current settings
      function initializeClients() {
        const settings = JSON.parse(localStorage.getItem('dialogueSettings') || '{}');
        if (settings.apiKey) {
          openaiClient = new OpenAIClient(settings.apiKey, {
            model: settings.model || 'gpt-4-turbo'
          });
        }
      }

      // Set up event listeners
      function setupEventListeners() {
        // Chat form submission
        chatForm.addEventListener('submit', handleChatSubmit);
        
        // Save settings button
        saveSettingsBtn.addEventListener('click', saveSettings);
        
        // Clear settings button
        document.getElementById('clearSettingsBtn').addEventListener('click', () => {
          localStorage.removeItem('dialogueSettings');
          apiKeyInput.value = '';
          modelSelect.value = 'gpt-4-turbo';
          appendMessage('system', 'Settings have been cleared.');
        });
        
        // Tool call interceptor events
        document.addEventListener('openai-tool-call', handleToolCall);
      }

      // Handle chat form submission
      async function handleChatSubmit(event) {
        event.preventDefault();
        const userMessage = userInput.value.trim();
        
        if (!userMessage) return;
        
        // Clear input
        userInput.value = '';
        
        // Add user message to UI
        appendMessage('user', userMessage);
        
        // Add to conversation history
        conversationHistory.push({
          role: 'user',
          content: userMessage
        });
        
        // Check if OpenAI client is initialized
        if (!openaiClient) {
          appendMessage('system', 'Please set your OpenAI API key in the settings panel.');
          togglePanel();
          return;
        }
          
        // Disable input while processing
        userInput.disabled = true;
        document.querySelector('#chatForm button').disabled = true;
        
        try {
          // Add typing indicator
          const typingIndicator = appendMessage('assistant', '<div class="spinner-border spinner-border-sm text-secondary" role="status"><span class="visually-hidden">Loading...</span></div>');
          
          // Use streaming for better UX
          if (true) { // Always use streaming for now
            // Create message element first
            const messageElement = document.createElement('div');
            messageElement.className = 'message assistant';
            messageElement.innerHTML = '';
            typingIndicator.remove();
            chatMessages.appendChild(messageElement);
            
            let assistantResponse = '';
            let currentToolCall = null;
            
            // Stream the response
            const streamIterator = await openaiClient.createChatCompletion(
              conversationHistory,
              openaiTools.getDefaultTools(),
              { stream: true }
            );
            
            try {
              for await (const chunk of streamIterator) {
                if (chunk.choices && chunk.choices[0]) {
                  const delta = chunk.choices[0].delta;
                  
                  // Handle content updates
                  if (delta.content) {
                    assistantResponse += delta.content;
                    messageElement.innerHTML = assistantResponse;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                  }
                }
              }
              
              // Add completed message to conversation history
              if (assistantResponse) {
                conversationHistory.push({
                  role: 'assistant',
                  content: assistantResponse
                });
              }
            } catch (streamError) {
              console.error('Error in stream processing:', streamError);
              messageElement.innerHTML += `\n\n<span class="text-danger">Error: ${streamError.message}</span>`;
            }
          } else {
            // Non-streaming fallback (kept for reference)
            const response = await openaiClient.createChatCompletion(
              conversationHistory,
              openaiTools.getDefaultTools(),
              { stream: false }
            );
            
            // Remove typing indicator
            typingIndicator.remove();
            
            // Process the response
            const assistantMessage = response.choices[0].message;
            
            // Add to conversation history
            conversationHistory.push({
              role: 'assistant',
              content: assistantMessage.content
            });
            
            // Display the message
            appendMessage('assistant', assistantMessage.content || '');
            
            // Process any tool calls
            if (assistantMessage.tool_calls) {
              assistantMessage.tool_calls.forEach(toolCall => {
                if (openaiClient.interceptedTools.includes(toolCall.function.name)) {
                  const args = JSON.parse(toolCall.function.arguments);
                  openaiClient._interceptToolCall(toolCall.function.name, args, toolCall.id);
                }
              });
            }
          }
        } catch (error) {
          console.error('Error calling OpenAI API:', error);
          appendMessage('system', `Error: ${error.message}`);
        } finally {
          // Re-enable input regardless of success/failure
          userInput.disabled = false;
          document.querySelector('#chatForm button').disabled = false;
        }
      }

      // Handle tool call events
      function handleToolCall(event) {
        const { functionName, args, toolCallId } = event.detail;
      
        // Log the tool call
        console.log(`Tool call received: ${functionName}`, args, toolCallId);
      
        // Handle specific tool calls
        switch (functionName) {
          case '_meiliSearchProgress':
            handleMeiliSearchProgress(args, toolCallId);
            break;
          case '_meiliSearchSources':
            handleMeiliSearchSources(args, toolCallId);
            break;
          case '_meiliReportError':
            handleMeiliReportError(args, toolCallId);
            break;
          case '_meiliAppendConversationMessage':
            handleMeiliAppendConversationMessage(args, toolCallId);
            break;
          default:
            console.warn(`Unknown tool call function: ${functionName}`);
            appendMessage('system', `Received unknown tool call: ${functionName}`);
        }
      
        // Add tool call response to conversation history
        conversationHistory.push({
          role: 'tool',
          tool_call_id: toolCallId,
          content: JSON.stringify({
            status: 'success',
            function: functionName,
            timestamp: new Date().toISOString()
          })
        });
      
        // Automatically scroll to bottom when a tool call is processed
        setTimeout(() => {
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
      }
    
    // Handle Meilisearch progress updates
    function handleMeiliSearchProgress(args, toolCallId) {
      const { call_id, function_name, function_parameters } = args;
      
      // Parse the function parameters
      let params = {};
      try {
        params = JSON.parse(function_parameters);
        
        // Create a more user-friendly display of parameters
        const displayParams = Object.entries(params)
          .map(([key, value]) => `<strong>${key}</strong>: ${typeof value === 'string' ? value : JSON.stringify(value)}`)
          .join('<br>');
        
        // Add system message to indicate search is in progress
        const progressHtml = `
          <div class="search-results">
            <h6><i class="bi bi-search"></i> Search in Progress</h6>
            <div class="progress mb-2">
              <div class="progress-bar progress-bar-striped progress-bar-animated" 
                   role="progressbar" style="width: 100%"></div>
            </div>
            <p>Searching with <code>${function_name}</code>:</p>
            <div class="params small">${displayParams}</div>
            <p class="mt-2 small text-muted">Search ID: ${call_id || 'unknown'}</p>
          </div>
        `;
        appendMessage('tool', progressHtml);
        
      } catch (error) {
        console.error('Error parsing function parameters:', error);
        appendMessage('system', `Searching with ${function_name}... (ID: ${call_id || 'unknown'})`);
      }
      
      // Only add to conversation history if we have a valid tool call ID
      if (toolCallId) {
        conversationHistory.push({
          role: 'tool',
          tool_call_id: toolCallId,
          content: JSON.stringify({ 
            status: 'in_progress', 
            call_id: call_id || 'unknown', 
            function_name 
          })
        });
      }
    }
    
    // Handle Meilisearch source results
    function handleMeiliSearchSources(args, toolCallId) {
      const { call_id, documents } = args;
      
      // Display search results to the user
      let resultsHtml = '<div class="search-results">';
      resultsHtml += `<h6><i class="bi bi-journals"></i> Search Results</h6>`;
      
      if (documents && Object.keys(documents).length > 0) {
        const resultCount = Object.keys(documents).length;
        resultsHtml += `<p class="small text-muted mb-2">Found ${resultCount} result${resultCount !== 1 ? 's' : ''}</p>`;
        resultsHtml += '<div class="list-group">';
        
        for (const [key, doc] of Object.entries(documents)) {
          // Extract document properties with fallbacks
          const title = doc.title || doc.name || key;
          const description = doc.description || doc.content || doc.text || '';
          const url = doc.url || '';
          const source = doc.source || '';
          
          resultsHtml += `<div class="list-group-item list-group-item-action">
            <div class="d-flex w-100 justify-content-between">
              <h6 class="mb-1">${title}</h6>
              ${source ? `<small class="text-muted">${source}</small>` : ''}
            </div>
            <p class="mb-1 small">${description.substring(0, 200)}${description.length > 200 ? '...' : ''}</p>
            ${url ? `<a href="${url}" target="_blank" class="small">View source <i class="bi bi-box-arrow-up-right"></i></a>` : ''}
          </div>`;
        }
        
        resultsHtml += '</div>';
      } else {
        resultsHtml += '<div class="alert alert-warning">No results found.</div>';
      }
      
      resultsHtml += `<p class="mt-2 small text-muted">Search ID: ${call_id || 'unknown'}</p>`;
      resultsHtml += '</div>';
      
      appendMessage('tool', resultsHtml);
      
      // Only add to conversation history if we have a valid tool call ID
      if (toolCallId) {
        conversationHistory.push({
          role: 'tool',
          tool_call_id: toolCallId,
          content: JSON.stringify({ 
            status: 'completed', 
            call_id: call_id || 'unknown', 
            result_count: Object.keys(documents || {}).length 
          })
        });
      }
    }
    
    // Handle Meilisearch error reporting
    function handleMeiliReportError(args, toolCallId) {
      const { error_code, message } = args;
      
      // Display error to the user
      const errorHtml = `<div class="alert alert-danger">
        <h6><i class="bi bi-exclamation-triangle-fill"></i> Error Occurred</h6>
        <p><strong>${error_code}:</strong> ${message}</p>
      </div>`;
      appendMessage('tool', errorHtml);
      
      console.error(`Meilisearch error: ${error_code} - ${message}`);
      
      // Only add to conversation history if we have a valid tool call ID
      if (toolCallId) {
        conversationHistory.push({
          role: 'tool',
          tool_call_id: toolCallId,
          content: JSON.stringify({ error: true, error_code, message })
        });
      }
      
      // Add a more friendly explanation for common errors
      let userFriendlyMessage = '';
      
      switch(error_code) {
        case 'invalid_api_key':
          userFriendlyMessage = 'The API key you provided is invalid or missing. Please check your settings.';
          break;
        case 'index_not_found':
          userFriendlyMessage = 'The search index could not be found. This may be a configuration issue.';
          break;
        case 'search_failed':
          userFriendlyMessage = 'The search operation failed. Please try again with different search terms.';
          break;
        case 'rate_limit_exceeded':
          userFriendlyMessage = 'Too many requests. Please wait a moment before trying again.';
          break;
      }
      
      if (userFriendlyMessage) {
        appendMessage('system', userFriendlyMessage);
      }
    }
    
    // Handle appending conversation messages
    function handleMeiliAppendConversationMessage(args, toolCallId) {
      const { role, content, tool_calls, tool_call_id } = args;
      
      // Ensure role is valid
      const validRole = ['user', 'assistant', 'system', 'tool'].includes(role) ? role : 'system';
      
      // Add the message to the UI with appropriate formatting
      let formattedContent = content || '';
      
      // Special formatting for system messages to make them more visible
      if (validRole === 'system') {
        formattedContent = `<div class="system-message-content">${formattedContent}</div>`;
      }
      
      // Special formatting for assistant messages that contain markdown or code
      if (validRole === 'assistant' && formattedContent.includes('```')) {
        // This is a simple markdown-like formatter - a real app would use a proper markdown parser
        formattedContent = formattedContent
          .replace(/```(\w*)([\s\S]*?)```/g, '<pre class="bg-light p-2 rounded"><code>$2</code></pre>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>');
      }
      
      // Add the message to the UI
      appendMessage(validRole, formattedContent);
      
      // Add to conversation history
      const message = {
        role: role,
        content: content || ''
      };
      
      // If there are tool calls, add them to the message
      if (tool_calls && tool_calls.length > 0) {
        message.tool_calls = tool_calls;
        
        // Also display the tool calls in the UI if they're interesting to the user
        const toolCallsDisplay = tool_calls
          .filter(tc => !tc.function.name.startsWith('_meili')) // Filter out internal tool calls
          .map(tc => {
            const fnName = tc.function.name;
            let fnArgs;
            try {
              fnArgs = JSON.parse(tc.function.arguments);
              fnArgs = JSON.stringify(fnArgs, null, 2);
            } catch (e) {
              fnArgs = tc.function.arguments;
            }
            return `<div class="tool-call">
              <div class="tool-name"><i class="bi bi-tools"></i> ${fnName}</div>
              <pre class="tool-args small">${fnArgs}</pre>
            </div>`;
          }).join('');
          
        if (toolCallsDisplay) {
          appendMessage('system', `<div class="tool-calls-container">${toolCallsDisplay}</div>`);
        }
      }
      
      // If this is a response to a tool call, add the tool call ID
      if (tool_call_id) {
        message.tool_call_id = tool_call_id;
      }
      
      conversationHistory.push(message);
      
      console.log(`Added message to conversation: ${role} - ${content ? content.substring(0, 50) : ''}...`);
    }

      // Add message to the chat UI
      function appendMessage(role, content) {
        const messageElement = document.createElement('div');
        messageElement.className = `message ${role}`;
        messageElement.innerHTML = content;
        
        // Add timestamp to all messages
        const timestamp = document.createElement('div');
        timestamp.className = 'message-timestamp small text-muted';
        timestamp.textContent = new Date().toLocaleTimeString();
        
        // Don't show timestamp on system messages unless they're important
        if (role !== 'system' || content.includes('Error') || content.includes('saved successfully')) {
          messageElement.appendChild(timestamp);
        }
        
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Add animations based on message type
        if (role === 'system' || role === 'tool') {
          messageElement.style.opacity = '0';
          messageElement.style.transform = 'translateY(10px)';
          messageElement.style.transition = 'opacity 0.3s ease-in-out, transform 0.3s ease-in-out';
          setTimeout(() => {
            messageElement.style.opacity = '1';
            messageElement.style.transform = 'translateY(0)';
          }, 10);
        } else if (role === 'assistant') {
          messageElement.style.opacity = '0';
          messageElement.style.transition = 'opacity 0.2s ease-in-out';
          setTimeout(() => {
            messageElement.style.opacity = '1';
          }, 10);
        }
        
        return messageElement;
      }

      // Toggle panel function
      function togglePanel() {
        const rightPanel = document.getElementById('rightPanel');
        rightPanel.classList.toggle('show');
      }

      // Initialize the app when the DOM is loaded
      document.addEventListener('DOMContentLoaded', initApp);
      
      // Export the togglePanel function to the global scope
      window.togglePanel = togglePanel;
    </script>
  </body>
</html>
