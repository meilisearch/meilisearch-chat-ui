<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
        --bd-violet-rgb: 113, 44, 249;
        }

      .container-wrapper {
        display: flex;
        min-height: 100vh;
      }
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .right-panel {
        width: 0;
        overflow: hidden;
        background-color: #f8f9fa;
        border-left: 1px solid #dee2e6;
        transition: width 0.3s ease-in-out;
      }
      .right-panel.show {
        width: 300px;
      }
      .panel-content {
        width: 300px;
        padding: 1rem;
      }
      
      /* Chat interface styles */
      .chat-container {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .message {
        padding: 0.75rem;
        border-radius: 0.5rem;
        max-width: 80%;
      }
      .message.user {
        align-self: flex-end;
        background-color: #007bff;
        color: white;
      }
      .message.assistant {
        align-self: flex-start;
        background-color: #f0f0f0;
        color: #333;
      }
      .message.system {
        align-self: center;
        background-color: #ffc107;
        color: #333;
        font-style: italic;
        font-size: 0.9rem;
      }
      .chat-input {
        padding: 1rem;
        border-top: 1px solid #dee2e6;
      }

      .bd-navbar {
          padding: .75rem 0;
          /* background-color: transparent; */
          background-image: linear-gradient(rgba(var(--bd-violet-rgb), 1), rgba(var(--bd-violet-rgb), .95));
          box-shadow: 0 .5rem 1rem #00000026, inset 0 -1px #ffffff26;
      }
    </style>
  </head>

  <body>
    <div class="container-wrapper">
      <div class="main-content">
        <nav class="navbar bd-navbar" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">OpenAI Chat</a>
                <button class="btn btn-outline-light" type="button" onclick="togglePanel()">
                    Toggle Panel
                </button>
            </div>
        </nav>

        <div class="container-fluid p-4 flex-grow-1">
          <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be inserted here by JavaScript -->
                    <div class="message system">
                      Welcome to OpenAI Chat! How can I help you today? I can intercept specific tool calls.
                    </div>
                  </div>
            <div class="chat-input">
              <form id="chatForm">
                <div class="input-group">
                  <input type="text" id="userInput" class="form-control" placeholder="Type your message here..." autocomplete="off">
                  <button class="btn btn-primary" type="submit">
                    <i class="bi bi-send"></i> Send
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="right-panel" id="rightPanel">
        <div class="panel-content">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Settings</h4>
            <button type="button" class="btn-close" aria-label="Close" onclick="togglePanel()"></button>
          </div>
          <hr>
          <div class="mb-3">
            <h6>API Configuration</h6>
            <div class="mb-3">
              <label for="apiKeyInput" class="form-label">OpenAI API Key</label>
              <input type="password" class="form-control" id="apiKeyInput" placeholder="sk-...">
              <div class="form-text">Your API key is stored locally and never sent to our servers.</div>
            </div>
            <div class="mb-3">
              <label for="modelSelect" class="form-label">Model</label>
              <select class="form-select" id="modelSelect">
                <option value="gpt-4-turbo">GPT-4 Turbo</option>
                <option value="gpt-4">GPT-4</option>
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
              </select>
            </div>
          </div>
          <hr>

          <hr>
          <div class="d-grid">
            <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { OpenAIClient, openaiTools } from './openai-client.js';

      // DOM Elements
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const chatMessages = document.getElementById('chatMessages');
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const modelSelect = document.getElementById('modelSelect');

      // Client instances
      let openaiClient;
      let conversationHistory = [];

      // Initialize the app
      function initApp() {
        loadSettings();
        setupEventListeners();
        initializeClients();
      }

      // Load settings from localStorage
      function loadSettings() {
        const settings = JSON.parse(localStorage.getItem('dialogueSettings') || '{}');
        apiKeyInput.value = settings.apiKey || '';
        modelSelect.value = settings.model || 'gpt-4-turbo';
      }

      // Save settings to localStorage
      function saveSettings() {
        const settings = {
          apiKey: apiKeyInput.value,
          model: modelSelect.value
        };
        localStorage.setItem('dialogueSettings', JSON.stringify(settings));
        initializeClients();
      }

      // Initialize clients with current settings
      function initializeClients() {
        const settings = JSON.parse(localStorage.getItem('dialogueSettings') || '{}');
        if (settings.apiKey) {
          openaiClient = new OpenAIClient(settings.apiKey, {
            model: settings.model || 'gpt-4-turbo'
          });
        }
      }

      // Set up event listeners
      function setupEventListeners() {
        // Chat form submission
        chatForm.addEventListener('submit', handleChatSubmit);
        
        // Save settings button
        saveSettingsBtn.addEventListener('click', saveSettings);
        
        // Tool call interceptor events
        document.addEventListener('openai-tool-call', handleToolCall);
      }

      // Handle chat form submission
      async function handleChatSubmit(event) {
        event.preventDefault();
        const userMessage = userInput.value.trim();
        
        if (!userMessage) return;
        
        // Clear input
        userInput.value = '';
        
        // Add user message to UI
        appendMessage('user', userMessage);
        
        // Add to conversation history
        conversationHistory.push({
          role: 'user',
          content: userMessage
        });
        
        // Check if OpenAI client is initialized
        if (!openaiClient) {
          appendMessage('system', 'Please set your OpenAI API key in the settings panel.');
          togglePanel();
          return;
        }
        
        try {
          // Add typing indicator
          const typingIndicator = appendMessage('assistant', '<div class="spinner-border spinner-border-sm text-secondary" role="status"><span class="visually-hidden">Loading...</span></div>');
          
          // Call OpenAI API
          const response = await openaiClient.createChatCompletion(
            conversationHistory,
            openaiTools.getDefaultTools(),
            { stream: false }
          );
          
          // Remove typing indicator
          typingIndicator.remove();
          
          // Process the response
          const assistantMessage = response.choices[0].message;
          
          // Add to conversation history
          conversationHistory.push({
            role: 'assistant',
            content: assistantMessage.content
          });
          
          // Display the message
          appendMessage('assistant', assistantMessage.content || '');
          
          // Process any tool calls
          if (assistantMessage.tool_calls) {
            assistantMessage.tool_calls.forEach(toolCall => {
              if (openaiClient.interceptedTools.includes(toolCall.function.name)) {
                const args = JSON.parse(toolCall.function.arguments);
                openaiClient._interceptToolCall(toolCall.function.name, args, toolCall.id);
              }
            });
          }
        } catch (error) {
          console.error('Error calling OpenAI API:', error);
          appendMessage('system', `Error: ${error.message}`);
        }
      }

      // Handle tool call events
    function handleToolCall(event) {
      const { functionName, args } = event.detail;
      
      // Log the tool call
      console.log(`Tool call received: ${functionName}`, args);
      
      // Handle specific tool calls with minimal implementation
      switch (functionName) {
        case '_meiliSearchProgress':
          console.log(`Search progress: ${args.query} - ${args.status} (${args.progress || 0}%)`);
          break;
        case '_meiliSearchSources':
          console.log(`Search sources: ${args.query}`);
          break;
        case '_meiliReportError':
          console.error(`Error reported: ${args.message}`);
          break;
        case '_meiliAppendConversationMessage':
          console.log(`Append message: ${args.role} - ${args.content.substring(0, 50)}...`);
          break;
      }
    }

      // Add message to the chat UI
      function appendMessage(role, content) {
        const messageElement = document.createElement('div');
        messageElement.className = `message ${role}`;
        messageElement.innerHTML = content;
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return messageElement;
      }

      // Toggle panel function
      function togglePanel() {
        const rightPanel = document.getElementById('rightPanel');
        rightPanel.classList.toggle('show');
      }

      // Initialize the app when the DOM is loaded
      document.addEventListener('DOMContentLoaded', initApp);
      
      // Export the togglePanel function to the global scope
      window.togglePanel = togglePanel;
    </script>
  </body>
</html>
