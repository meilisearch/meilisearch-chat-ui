<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magik RAG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/highlight.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #202123;
            color: #ccc;
        }

        .header {
            padding: 1rem 0;
            color: #ccc;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px;
            max-width: 800px;
            margin: 0 auto;
        }

        .message-row {
            padding: 1rem;
            width: 100%;
            margin-bottom: 0.5rem;
            color: #ccc;
        }

        .user-message .message-content {
            max-width: 80%;
            padding: 1rem;
            border-radius: 1.5rem;
            background-color: #444654;
            margin-left: auto;
            position: relative;
        }

        .assistant-message .message-content {
            width: 100%;
            padding: 1rem;
            position: relative;
        }

        .input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background-color: #202123;
            z-index: 100;
        }

        .centered-input-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 600px;
            z-index: 100;
        }

        .input-box {
            resize: none;
            padding-left: 40px;
            min-height: 80px;
            border-radius: 20px !important;
            color: #ccc !important;
            background-color: #444654 !important;
            border: 2px solid #666 !important;
        }

        .input-box:focus {
            box-shadow: none !important;
            border-color: #999 !important;
        }

        .input-box::placeholder {
            color: #9aa3b0 !important;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #ccc;
            border-radius: 50%;
            margin: 0 2px;
            opacity: 0.6;
            animation: typing 1.5s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        pre {
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
            color: #ccc;
        }

        code {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 2px 4px;
            border-radius: 3px;
            color: #ccc;
        }

        .message-content table {
            border-collapse: collapse;
            margin: 10px 0;
            color: #ccc;
            width: 100%;
        }

        .message-content th,
        .message-content td {
            border: 1px solid #444;
            padding: 8px;
        }

        .message-content th {
            background-color: #333;
            text-align: left;
        }

        .message-content tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .message-content blockquote {
            border-left: 3px solid #555;
            padding-left: 10px;
            color: #aaa;
            margin: 10px 0;
        }

        .message-content ul,
        .message-content ol {
            padding-left: 20px;
        }

        .message-content a {
            color: #3b82f6;
            text-decoration: none;
        }

        .message-content a:hover {
            text-decoration: underline;
        }

        .message-content img {
            max-width: 100%;
            border-radius: 4px;
        }

        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin-top: 16px;
            margin-bottom: 10px;
            color: #ccc;
        }

        .settings-icon {
            position: absolute;
            bottom: 17px;
            left: 15px;
            font-size: 1rem;
            cursor: pointer;
            color: #9aa3b0;
            z-index: 1000;
        }

        .settings-icon:hover {
            color: #ccc;
        }

        .hidden {
            display: none !important;
        }

        /* Search tool call animation styles */
        .search-indicator-container {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px 14px;
            background-color: #343541;
            border-radius: 6px;
            animation: fadeIn 0.4s ease-in-out;
            border-left: 3px solid #777;
            position: relative;
            overflow: hidden;
        }

        .search-indicator-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #999, transparent);
            animation: loading 1.5s infinite;
        }

        .search-pulse {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #777;
            margin-right: 12px;
            animation: pulse 1.5s infinite ease-in-out;
            box-shadow: 0 0 0 rgba(119, 119, 119, 0.5);
            position: relative;
        }

        .search-pulse::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            border: 3px solid #777;
            animation: ripple 1.5s infinite ease-out;
            opacity: 0;
        }

        .search-text {
            color: #bbb;
            font-weight: 400;
            font-size: 0.95em;
        }

        .search-params {
            margin-top: 3px;
            font-size: 0.8em;
            color: #777;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .tool-results {
            padding: 10px;
            background-color: #343541;
            border-radius: 6px;
            border-left: 3px solid #777;
            margin-bottom: 10px;
        }

        .tool-results h4 {
            margin-top: 0;
            margin-bottom: 0;
            color: #bbb;
            font-weight: 500;
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 0.95em;
        }

        .tool-results h4::before {
            content: '';
            margin-right: 8px;
            width: 20px;
            height: 20px;
            background-color: #777;
            border-radius: 50%;
        }

        .tool-results-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 0;
        }

        .tool-results-content.expanded {
            max-height: 500px;
            margin-top: 12px;
            overflow-y: auto;
        }

        .tool-results h4::after {
            content: '›';
            margin-left: auto;
            font-size: 0.9em;
            transition: transform 0.3s ease;
            transform: rotate(90deg);
        }

        .tool-results h4.collapsed::after {
            transform: rotate(0deg);
        }

        .movie-item {
            margin-bottom: 6px;
            padding: 10px;
            background-color: #2d2d38;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            color: #bbb;
            font-size: 0.9em;
        }

        .movie-item:hover {
            background-color: #32323e;
        }

        .movie-title {
            font-weight: 500;
            color: #bbb;
            margin-bottom: 4px;
        }

        .tool-message {
            animation: fadeIn 0.5s ease-in-out;
            margin-bottom: 12px;
        }

        .document-content {
            margin-top: 6px;
            font-size: 14px;
            line-height: 1.4;
            color: #bbb;
        }

        .document-properties {
            margin-top: 6px;
            font-size: 14px;
        }

        .document-property-list {
            display: grid;
            grid-template-columns: max-content auto;
            grid-gap: 6px 12px;
            margin: 0;
        }

        .document-property-list dt {
            font-weight: bold;
            color: #aaa;
            text-align: right;
        }

        .document-property-list dd {
            margin: 0;
            color: #bbb;
            overflow-wrap: break-word;
            word-break: break-all;
        }



        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(0.9);
                opacity: 0.7;
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0;
            }
            40% {
                opacity: 0.5;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            70% { opacity: 0.7; transform: translateY(-2px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <header class="text-center header">
            <h3 class="mb-0">Magik RAG</h3>
        </header>

        <div class="chat-container" id="chat-container"></div>

        <div class="centered-input-container" id="centered-input">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12">
                        <form id="chat-form">
                            <div class="input-group">
                                <div class="settings-icon" id="settings-button">
                                    <i class="bi bi-gear"></i>
                                </div>
                                <textarea
                                    class="form-control input-box"
                                    id="user-input"
                                    placeholder="Ask me anything"
                                    rows="4"
                                    autofocus
                                ></textarea>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container hidden" id="bottom-input">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <form id="bottom-chat-form">
                            <div class="input-group">
                                <div class="settings-icon" id="bottom-settings-button">
                                    <i class="bi bi-gear"></i>
                                </div>
                                <textarea
                                    class="form-control input-box"
                                    id="bottom-user-input"
                                    placeholder="Ask me anything"
                                    rows="3"
                                    autofocus
                                ></textarea>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="tools.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Helper function for handling collapsible elements
            window.toggleCollapsible = function(header) {
                header.classList.toggle('collapsed');
                const content = header.nextElementSibling;
                content.classList.toggle('expanded');
            };
            // Configuration variables
            let meilisearchUrl = localStorage.getItem('meilisearchUrl');
            let apiKey = localStorage.getItem('meilisearchApiKey');
            let modelName = localStorage.getItem('modelName') || 'gpt-4o';

            // Debug logging enabled for console only
            let toolCalls = {}; // Map tool_call_id to their search indicator elements
            let searchIndicators = []; // Array to track multiple search indicators
            
            // Register Meilisearch tools from tools.js
            const meiliTools = tools || [];
            
            // Track active tool calls and their responses
            let activeToolCalls = {};
            
            // Track active search progress indicators by call ID
            let searchProgressIndicators = {};
            
            // Flag to control whether we use the Meilisearch tools for UI
            let useMeiliToolsForUI = true;
            
            // Meilisearch tool handlers
            function handleMeiliSearchProgress(callId, functionName, functionParams) {
                console.log(`[Meili] Search Progress for ${callId}`);
                console.log(`[Meili] Function: ${functionName}`);
                console.log(`[Meili] Parameters: ${functionParams}`);
                
                let functionParamsObj = functionParams;
                // Handle function_arguments vs function_parameters difference in naming
                if (typeof functionParams === 'string') {
                    try {
                        functionParamsObj = JSON.parse(functionParams);
                    } catch (e) {
                        console.error('Error parsing function parameters:', e);
                        functionParamsObj = {};
                    }
                }
                
                // Create or update search progress indicator
                const indicator = createOrUpdateSearchIndicator(callId, functionName, functionParamsObj);
                searchProgressIndicators[callId] = indicator;
                
                return { status: "searching", progress: 0.5 };
            }
            
            // Function to create or update search indicator based on tool call
            function createOrUpdateSearchIndicator(callId, functionName, functionParams) {
                // Check if we already have an indicator for this call
                let searchIndicatorRow = document.querySelector(`[data-meili-call-id="${callId}"]`);
                
                // If we don't have an indicator yet, create one
                if (!searchIndicatorRow) {
                    searchIndicatorRow = document.createElement('div');
                    searchIndicatorRow.className = 'message-row';
                    searchIndicatorRow.dataset.meiliCallId = callId;
                    searchIndicatorRow.dataset.timestamp = Date.now().toString();
                    
                    const searchIndicatorContainer = document.createElement('div');
                    searchIndicatorContainer.className = 'search-indicator-container';
                    
                    const searchPulse = document.createElement('div');
                    searchPulse.className = 'search-pulse';
                    
                    const searchInfo = document.createElement('div');
                    searchInfo.className = 'search-info';
                    
                    // Create search text with function information
                    const searchText = document.createElement('div');
                    searchText.className = 'search-text';
                    
                    // Parse the function parameters if provided as a string
                    let params = {};
                    if (typeof functionParams === 'string') {
                        try {
                            params = JSON.parse(functionParams);
                        } catch (e) {
                            console.error('Error parsing function parameters:', e);
                        }
                    } else if (functionParams && typeof functionParams === 'object') {
                        params = functionParams;
                    }
                    
                    // Try to extract the query from function_arguments if present
                    let queryParam = null;
                    if (params.function_arguments && typeof params.function_arguments === 'string') {
                        try {
                            const args = JSON.parse(params.function_arguments);
                            if (args.q) {
                                queryParam = args.q;
                            } else if (args.query) {
                                queryParam = args.query;
                            }
                        } catch (e) {
                            console.error('Error parsing function_arguments:', e);
                        }
                    }
                    
                    // Determine appropriate display text
                    let displayText = '';
                    if (queryParam) {
                        displayText = `"${queryParam}"`;
                    } else if (params.q) {
                        displayText = `"${params.q}"`;
                    } else if (params.query) {
                        displayText = `"${params.query}"`;
                    } else if (typeof params === 'object' && Object.keys(params).length > 0) {
                        const firstKey = Object.keys(params)[0];
                        const value = params[firstKey];
                        if (typeof value === 'string') {
                            displayText = `${firstKey}: "${value}"`;
                        } else {
                            displayText = `${firstKey}: ${JSON.stringify(value).substring(0, 50)}`;
                        }
                    }
                    
                    searchText.textContent = `Running ${functionName}${displayText ? ' with ' + displayText : ''}`;
                    
                    const searchParams = document.createElement('div');
                    searchParams.className = 'search-params';
                    searchParams.textContent = `Call ID: ${callId}`;
                    
                    // Assemble the indicator
                    searchInfo.appendChild(searchText);
                    searchInfo.appendChild(searchParams);
                    searchIndicatorContainer.appendChild(searchPulse);
                    searchIndicatorContainer.appendChild(searchInfo);
                    searchIndicatorRow.appendChild(searchIndicatorContainer);
                    
                    // Insert search indicator before assistant message or at the end of chat
                    chatContainer.appendChild(searchIndicatorRow);
                    
                    // Store this search indicator in our tracking arrays
                    searchIndicators.push(searchIndicatorRow);
                    toolCalls[callId] = searchIndicatorRow;
                    
                    // Scroll if needed
                    if (isScrolledToBottom()) {
                        window.scrollTo(0, document.body.scrollHeight);
                    }
                }
                
                return searchIndicatorRow;
            }
            
            function handleMeiliAppendConversationMessage(role, content, toolCalls, toolCallId) {
                console.log(`[Meili] Append Message: ${role}`);
                console.log(`[Meili] Content: ${content}`);
                console.log(`[Meili] Tool Calls:`, toolCalls);
                console.log(`[Meili] Tool Call ID: ${toolCallId}`);
                
                // Only add to conversation history, don't display in UI
                // This is crucial for keeping context for follow-up questions
                const messageObj = {
                    role: role,
                };
                
                // Add content if provided
                if (content) {
                    messageObj.content = content;
                }
                
                // Add tool_calls if provided
                if (toolCalls && Array.isArray(toolCalls) && toolCalls.length > 0) {
                    messageObj.tool_calls = toolCalls;
                }
                
                // Add tool_call_id if provided
                if (toolCallId) {
                    messageObj.tool_call_id = toolCallId;
                }
                
                // Add to conversation history
                conversationHistory.push(messageObj);
                
                console.log('Added message to conversation history:', messageObj);
                
                return { status: "appended" };
            }
            
            function handleMeiliSearchSources(callId, sources) {
                console.log(`[Meili] Search Sources for ${callId}`);
                console.log(`[Meili] Sources:`, sources);
                
                // Parse sources to get documents if needed
                let documents = [];
                
                if (sources) {
                    if (typeof sources === 'string') {
                        try {
                            documents = JSON.parse(sources);
                        } catch (e) {
                            console.error('Error parsing sources:', e);
                        }
                    } else if (Array.isArray(sources)) {
                        documents = sources;
                    } else if (sources.sources && Array.isArray(sources.sources)) {
                        documents = sources.sources;
                    }
                }
                
                // If documents is still an object with sources property, extract it
                if (documents && !Array.isArray(documents) && documents.sources) {
                    documents = documents.sources;
                }
                
                // Clear any loading indicators for this call
                hideLoadingIndicator();
                
                // Find the search indicator for this call - first check our tracking object
                let searchIndicatorRow = searchProgressIndicators[callId];
                
                // If not found in our tracking, try to find it in the DOM
                if (!searchIndicatorRow) {
                    searchIndicatorRow = document.querySelector(`[data-meili-call-id="${callId}"]`);
                }
                if (searchIndicatorRow && searchIndicatorRow.parentNode) {
                    // Transform the search indicator into results container
                    searchIndicatorRow.className = 'message-row tool-message';
                    
                    // Clear the existing content
                    searchIndicatorRow.innerHTML = '';
                    
                    // Create new message div
                    const toolMessageDiv = document.createElement('div');
                    toolMessageDiv.className = 'message-content';
                    searchIndicatorRow.appendChild(toolMessageDiv);
                    
                    // Create a container for results with collapsible content
                            const toolResults = document.createElement('div');
                            toolResults.className = 'tool-results';
                    
                            // Create the header
                            const toolHeader = document.createElement('h4');
                            toolHeader.className = 'collapsed';
                    
                            // Get count of documents for the header
                            const docCount = Array.isArray(documents) ? documents.length : 0;
                            toolHeader.textContent = `Search results (${docCount} ${docCount === 1 ? 'document' : 'documents'})`;
                            toolResults.appendChild(toolHeader);
                    
                    // Create the content container (collapsed by default)
                    const toolResultsContent = document.createElement('div');
                    toolResultsContent.className = 'tool-results-content';
                    
                    // Process documents
                    if (documents && documents.length > 0) {
                        const docArray = Array.isArray(documents) ? documents : [documents];
                        
                        for (const doc of docArray) {
                            const docItem = document.createElement('div');
                            docItem.className = 'movie-item';
                            
                            // Create title if available
                            if (doc.title) {
                                const docTitle = document.createElement('div');
                                docTitle.className = 'movie-title';
                                docTitle.textContent = doc.title;
                                docItem.appendChild(docTitle);
                            } else if (doc.name) {
                                const docTitle = document.createElement('div');
                                docTitle.className = 'movie-title';
                                docTitle.textContent = doc.name;
                                docItem.appendChild(docTitle);
                            } else if (doc.id) {
                                const docTitle = document.createElement('div');
                                docTitle.className = 'movie-title';
                                docTitle.textContent = `Document #${doc.id}`;
                                docItem.appendChild(docTitle);
                            }
                            
                            // Add other content if available
                            if (doc.content || doc.text || doc.description) {
                                const docContent = document.createElement('div');
                                docContent.className = 'document-content';
                                // Use marked to render markdown content
                                const contentText = doc.content || doc.text || doc.description;
                                docContent.innerHTML = marked.parse(contentText);
                                docItem.appendChild(docContent);
                            } else {
                                // Create a formatted display of the document's properties
                                const docContent = document.createElement('div');
                                docContent.className = 'document-properties';
                                
                                // Format the document as a list of properties
                                const dl = document.createElement('dl');
                                dl.className = 'document-property-list';
                                
                                for (const [key, value] of Object.entries(doc)) {
                                    // Skip id and title as they're already displayed
                                    if (key === 'id' || key === 'title' || key === 'name') continue;
                                    
                                    // Create term (property name)
                                    const dt = document.createElement('dt');
                                    dt.textContent = key;
                                    dl.appendChild(dt);
                                    
                                    // Create description (property value)
                                    const dd = document.createElement('dd');
                                    if (typeof value === 'object') {
                                        dd.textContent = JSON.stringify(value);
                                    } else {
                                        dd.textContent = value;
                                    }
                                    dl.appendChild(dd);
                                }
                                
                                docContent.appendChild(dl);
                                docItem.appendChild(docContent);
                            }
                            
                            toolResultsContent.appendChild(docItem);
                        }
                    } else {
                        // If we don't have proper documents, just display a message
                        const noDocsItem = document.createElement('div');
                        noDocsItem.className = 'movie-item';
                        noDocsItem.textContent = 'No search results available';
                        toolResultsContent.appendChild(noDocsItem);
                    }
                    
                    // Add the content to the results container
                    toolResults.appendChild(toolResultsContent);
                    
                    // Add click handler to toggle expansion
                    toolHeader.addEventListener('click', function() {
                        this.classList.toggle('collapsed');
                        toolResultsContent.classList.toggle('expanded');
                    });
                    
                    // Add the tool results to the message
                    toolMessageDiv.appendChild(toolResults);
                    
                    // Remove this indicator from all tracking mechanisms
                    delete toolCalls[callId];
                    delete searchProgressIndicators[callId];
                    searchIndicators = searchIndicators.filter(indicator => indicator !== searchIndicatorRow);
                    
                    // Scroll if needed
                    if (isScrolledToBottom()) {
                        window.scrollTo(0, document.body.scrollHeight);
                    }
                }
                
                return { status: "sources_processed" };
            }
            
            function handleMeiliReportError(errorCode, message) {
                console.log(`[Meili] Error: ${errorCode}`);
                console.log(`[Meili] Message: ${message}`);
                
                // Create an error message in the UI
                const errorRow = document.createElement('div');
                errorRow.className = 'message-row assistant-message';
                
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message-content';
                
                // Format error message with different styling based on error type
                let errorDisplay;
                switch(errorCode) {
                    case 'auth_error':
                    case 'api_key_error':
                    case 'llm_api_issue':
                        errorDisplay = `⚠️ **Authentication Error:** ${message}`;
                        break;
                    case 'search_error':
                        errorDisplay = `🔍 **Search Error:** ${message}`;
                        break;
                    case 'timeout':
                        errorDisplay = `⏱️ **Timeout Error:** ${message}`;
                        break;
                    default:
                        errorDisplay = `❌ **Error (${errorCode}):** ${message}`;
                }
                
                errorDiv.innerHTML = marked.parse(errorDisplay);
                
                errorRow.appendChild(errorDiv);
                chatContainer.appendChild(errorRow);
                
                // Hide any loading indicators
                hideLoadingIndicator();
                
                // Add to conversation history
                conversationHistory.push({
                    role: 'assistant',
                    content: `Error (${errorCode}): ${message}`
                });
                
                // Scroll if user was at bottom
                if (isScrolledToBottom()) {
                    window.scrollTo(0, document.body.scrollHeight);
                }
                
                return { status: "error_reported" };
            }

            // Debug logging function
            function logDebug(label, data) {
                console.log(`[DEBUG] ${label}:`, data);
            }

            // Conversation state
            let hasStartedConversation = false;

            // If not found in localStorage, prompt the user
            if (!meilisearchUrl || !apiKey) {
                promptForCredentials();
            }

            function promptForCredentials() {
                meilisearchUrl = prompt("Please enter the Meilisearch URL", meilisearchUrl || "");
                if (!meilisearchUrl) {
                    alert("A Meilisearch URL is required to continue.");
                    promptForCredentials();
                    return;
                }

                apiKey = prompt("Please enter your Meilisearch API Key", "");
                if (!apiKey) {
                    alert("An API Key is required to continue.");
                    promptForCredentials();
                    return;
                }

                modelName = prompt("Please enter the model name to use", modelName || "gpt-4o");
                if (!modelName) {
                    modelName = "gpt-4o"; // Default model if none provided
                }

                localStorage.setItem('meilisearchUrl', meilisearchUrl);
                localStorage.setItem('meilisearchApiKey', apiKey);
                localStorage.setItem('modelName', modelName);
            }

            // DOM Elements
            const chatContainer = document.getElementById('chat-container');
            const centeredInput = document.getElementById('centered-input');
            const bottomInput = document.getElementById('bottom-input');

            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');

            const bottomChatForm = document.getElementById('bottom-chat-form');
            const bottomUserInput = document.getElementById('bottom-user-input');

            const settingsButton = document.getElementById('settings-button');
            const bottomSettingsButton = document.getElementById('bottom-settings-button');

            // Event Listeners
            chatForm.addEventListener('submit', handleSubmit);
            bottomChatForm.addEventListener('submit', handleBottomSubmit);

            userInput.addEventListener('input', function() {
                adjustTextareaHeight(userInput);
            });

            bottomUserInput.addEventListener('input', function() {
                adjustTextareaHeight(bottomUserInput);
            });

            userInput.addEventListener('keydown', function(e) {
                handleKeyDown(e);
            });

            bottomUserInput.addEventListener('keydown', function(e) {
                handleKeyDown(e);
            });

            settingsButton.addEventListener('click', promptForCredentials);
            bottomSettingsButton.addEventListener('click', promptForCredentials);

            // Conversation history
            let conversationHistory = [];

            // Auto-resize textarea
            function adjustTextareaHeight(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.max(80, textarea.scrollHeight) + 'px';
            }

            // Handle Enter key to submit, Shift+Enter for new line
            function handleKeyDown(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (e.target.value.trim() !== '') {
                        const form = e.target.form;
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            }

            // Switch from centered to bottom input
            function switchToBottomInput() {
                if (!hasStartedConversation) {
                    // First transfer the content
                    bottomUserInput.value = userInput.value;

                    // Hide centered input and show bottom input
                    centeredInput.classList.add('hidden');
                    bottomInput.classList.remove('hidden');

                    // Focus the bottom input
                    bottomUserInput.focus();
                    adjustTextareaHeight(bottomUserInput);

                    hasStartedConversation = true;
                }
            }

            // Add a message to the chat
            // Function to check if user is scrolled to bottom
            function isScrolledToBottom() {
                const tolerance = 50; // pixels of tolerance
                return (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - tolerance);
            }

            function addMessage(role, content) {
                // If this is the first message, switch to bottom input
                if (!hasStartedConversation) {
                    switchToBottomInput();
                }

                // Check if user was at the bottom before adding content
                const wasAtBottom = isScrolledToBottom();

                const messageRow = document.createElement('div');
                messageRow.className = `message-row ${role === 'user' ? 'user-message' : 'assistant-message'}`;

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-content';

                // Use marked.js to render markdown
                // Configure marked options
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true,
                    gfm: true
                });

                // Render markdown
                messageDiv.innerHTML = marked.parse(content);

                // Apply syntax highlighting to any code blocks
                messageDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

                messageRow.appendChild(messageDiv);
                chatContainer.appendChild(messageRow);

                // Only scroll to bottom if user was already at the bottom
                if (wasAtBottom) {
                    window.scrollTo(0, document.body.scrollHeight);
                }

                // Add to conversation history
                conversationHistory.push({
                    role: role,
                    content: content
                });
            }

            // Show loading indicator
            function showLoadingIndicator() {
                const messageRow = document.createElement('div');
                messageRow.className = 'message-row assistant-message';
                messageRow.id = 'loading-indicator';

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-content';

                const typingIndicator = document.createElement('div');
                typingIndicator.className = 'd-flex align-items-center';

                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'typing-dot';
                    typingIndicator.appendChild(dot);
                }

                messageDiv.appendChild(typingIndicator);

                messageRow.appendChild(messageDiv);
                chatContainer.appendChild(messageRow);
                window.scrollTo(0, document.body.scrollHeight);
            }

            // Hide loading indicator
            function hideLoadingIndicator() {
                const loadingIndicator = document.getElementById('loading-indicator');
                if (loadingIndicator) {
                    loadingIndicator.remove();
                }
            }

            // Handle centered form submission
            async function handleSubmit(e) {
                e.preventDefault();

                const userMessage = userInput.value.trim();
                if (userMessage === '') return;

                // We'll switch to bottom input and show message there
                switchToBottomInput();

                // Process the message immediately
                handleMessage(userMessage);
            }

            // Handle bottom form submission
            async function handleBottomSubmit(e) {
                e.preventDefault();

                const userMessage = bottomUserInput.value.trim();
                if (userMessage === '') return;

                handleMessage(userMessage);
            }

            // Process user message and get response
            async function handleMessage(userMessage) {
                // Display user message
                addMessage('user', userMessage);

                // Clear input
                userInput.value = '';
                bottomUserInput.value = '';
                adjustTextareaHeight(userInput);
                adjustTextareaHeight(bottomUserInput);

                // Show loading indicator
                showLoadingIndicator();

                // Variables to track state
                let assistantMessage = '';
                let currentAssistantMessageElement = null;
                let toolEventActive = false;
                let localSearchIndicators = []; // Local array to track multiple search indicators
                let localToolCalls = {}; // Local map of tool_call_id to search indicator elements
                let searchIndicatorRow = null;

                // Create a message row for the assistant response
                const messageRow = document.createElement('div');
                messageRow.className = 'message-row assistant-message';

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-content';
                messageRow.appendChild(messageDiv);

                try {
                    // Prepare the request body with only essential fields
                    const requestBody = {
                        model: modelName,
                        messages: conversationHistory,
                        max_tokens: 1000,
                        stream: true, // Enable streaming
                        tools: meiliTools // Register the tools
                    };

                    // Make the API call to the /chat/completions endpoint with streaming
                    const response = await fetch(`${meilisearchUrl}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || 'Unknown error occurred');
                    }

                    // Get the response as a stream
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');

                    // Hide loading indicator once we start receiving the stream
                    hideLoadingIndicator();

                    // Add the message row to the chat container before streaming
                    chatContainer.appendChild(messageRow);

                    // Process the stream
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        // Decode the chunk
                        const chunk = decoder.decode(value, { stream: true });

                        // Log raw chunk in debug mode
                        logDebug("Raw chunk", chunk);

                        // Process each line in the chunk
                        const lines = chunk.split('\n').filter(line => line.trim() !== '');
                        for (const line of lines) {
                            // Skip the "data: " prefix and empty lines
                            if (line.startsWith('data: ')) {
                                const data = line.substring(6);

                                // Log raw data line
                                logDebug("Stream data line", data);

                                // Check if it's the [DONE] message
                                if (data === '[DONE]') continue;

                                // Log raw data to console
                                logDebug('Raw data', data);

                                try {
                                    // Support for different input formats (raw JSON or stringified JSON)
                                    let parsedData;
                                    try {
                                        parsedData = JSON.parse(data);
                                    } catch (innerError) {
                                        console.error('Error parsing JSON data:', innerError);
                                        continue;
                                    }

                                    // Log parsed data to console only

                                    // Debug: log all events
                                    logDebug("Event type", parsedData.object || "delta");
                                    logDebug("Parsed data", parsedData);

                                    // Check if this is a Mistral or similar initialization chunk
                                    if (parsedData.choices &&
                                        parsedData.choices[0] &&
                                        parsedData.choices[0].delta &&
                                        ((parsedData.choices[0].delta.role === "assistant" &&
                                          parsedData.choices[0].delta.content === "") ||
                                         // Also check for empty delta with null fields
                                         (parsedData.choices[0].delta.content === "" &&
                                          parsedData.choices[0].delta.function_call === null &&
                                          parsedData.choices[0].delta.tool_calls === null))) {
                                        // This is an initialization message, nothing to process
                                        continue;
                                    }

                                    // Handle global error event
                                    if (parsedData.object === "chat.completion.error") {
                                        // Create error message
                                        const errorRow = document.createElement('div');
                                        errorRow.className = 'message-row assistant-message';
                                        
                                        const errorDiv = document.createElement('div');
                                        errorDiv.className = 'message-content';
                                        
                                        // Get error message
                                        let errorContent = parsedData.tool || 'Unknown error occurred';
                                        errorDiv.innerHTML = marked.parse(`**Error:** ${errorContent}`);
                                        
                                        errorRow.appendChild(errorDiv);
                                        chatContainer.appendChild(errorRow);
                                        
                                        // Only scroll if user is already at the bottom
                                        if (isScrolledToBottom()) {
                                            window.scrollTo(0, document.body.scrollHeight);
                                        }
                                        
                                        // Update conversation history
                                        conversationHistory.push({
                                            role: 'assistant',
                                            content: `Error: ${errorContent}`
                                        });
                                    }
                                    // Handle tool-specific error
                                    else if (parsedData.object === "chat.completion.tool.error") {
                                        logDebug('Processing tool error', parsedData);
                                        
                                        // Find the corresponding search indicator for this tool_call_id
                                        const toolCallId = parsedData.tool?.tool_call_id || 'default';
                                        const correspondingIndicator = toolCalls[toolCallId] ||
                                                                       (searchIndicators.length > 0 ?
                                                                        searchIndicators[searchIndicators.length - 1] :
                                                                        null);
                                        
                                        // Create or transform message row
                                        let errorMessageRow, errorMessageDiv;
                                        
                                        if (correspondingIndicator && correspondingIndicator.parentNode) {
                                            // Transform the search indicator into error container
                                            errorMessageRow = correspondingIndicator;
                                            errorMessageRow.className = 'message-row tool-message';
                                            
                                            // Clear the existing content
                                            errorMessageRow.innerHTML = '';
                                            
                                            // Create new message div
                                            errorMessageDiv = document.createElement('div');
                                            errorMessageDiv.className = 'message-content';
                                            errorMessageRow.appendChild(errorMessageDiv);
                                            
                                            // Remove this indicator from our tracking
                                            delete toolCalls[toolCallId];
                                            searchIndicators = searchIndicators.filter(indicator => indicator !== correspondingIndicator);
                                        } else {
                                            // Create a new row if we don't have a search indicator
                                            errorMessageRow = document.createElement('div');
                                            errorMessageRow.className = 'message-row tool-message';
                                            
                                            errorMessageDiv = document.createElement('div');
                                            errorMessageDiv.className = 'message-content';
                                            errorMessageRow.appendChild(errorMessageDiv);
                                            
                                            // Add to chat container
                                            chatContainer.appendChild(errorMessageRow);
                                        }
                                        
                                        // Format the error content
                                        const errorContent = parsedData.tool?.content || 'Tool error occurred';
                                        errorMessageDiv.innerHTML = marked.parse(`**Tool Error:** ${errorContent}`);
                                        
                                        // Only scroll if user is already at the bottom
                                        if (isScrolledToBottom()) {
                                            window.scrollTo(0, document.body.scrollHeight);
                                        }
                                    }
                                    // Handle tool call event
                                    else if (parsedData.object === "chat.completion.tool.call" ||
                                       (parsedData.choices && parsedData.choices[0] &&
                                        parsedData.choices[0].delta &&
                                        parsedData.choices[0].delta.tool_calls)) {

                                        // Extract tool call information from different possible formats
                                        let toolCallData = null;
                                        let toolCallId = null;

                                        if (parsedData.object === "chat.completion.tool.call") {
                                            toolCallData = parsedData.tool;
                                            toolCallId = parsedData.tool_call_id;
                                        } else if (parsedData.choices &&
                                                  parsedData.choices[0] &&
                                                  parsedData.choices[0].delta &&
                                                  parsedData.choices[0].delta.tool_calls) {
                                            const toolCall = parsedData.choices[0].delta.tool_calls[0];
                                            toolCallData = {
                                                function: toolCall.function || {}
                                            };
                                            toolCallId = toolCall.id;
                                        }

                                        // Only proceed if we have valid tool call data
                                        if (!toolCallData) continue;

                                        logDebug('Processing tool call', { toolCallData, toolCallId });
                                        
                                        // Intercept Meilisearch tool calls
                                        if (useMeiliToolsForUI && toolCallData.function.name && toolCallData.function.name.startsWith('_meili')) {
                                            console.log(`Intercepted Meilisearch tool call: ${toolCallData.function.name}`);
                                            console.log('Tool call arguments:', toolCallData.function.arguments);
                                            
                                            // Parse the arguments
                                            let functionArgs;
                                            try {
                                                functionArgs = JSON.parse(toolCallData.function.arguments);
                                            } catch (e) {
                                                console.error('Error parsing tool call arguments:', e);
                                                // Try to extract params even if JSON is malformed
                                                let args = toolCallData.function.arguments || '';
                                                if (args.includes('call_id')) {
                                                    const callIdMatch = args.match(/"call_id"\s*:\s*"([^"]+)"/);
                                                    const funcNameMatch = args.match(/"function_name"\s*:\s*"([^"]+)"/);
                                                    functionArgs = {
                                                        call_id: callIdMatch ? callIdMatch[1] : 'unknown',
                                                        function_name: funcNameMatch ? funcNameMatch[1] : 'unknown',
                                                    };
                                                } else {
                                                    functionArgs = {};
                                                }
                                            }
                                            
                                            // Store the tool call for later reference
                                            activeToolCalls[toolCallId] = {
                                                name: toolCallData.function.name,
                                                args: functionArgs,
                                                response: null,
                                                time: Date.now()
                                            };
                                            
                                            // Handle each specific tool based on its name
                                            let response;
                                            // Always skip default indicator for Meilisearch tools
                                            let skipDefaultIndicator = true;
                                            
                                            switch (toolCallData.function.name) {
                                                case '_meiliSearchProgress':
                                                    console.log('Handling _meiliSearchProgress tool call');
                                                    response = handleMeiliSearchProgress(
                                                        functionArgs.call_id, 
                                                        functionArgs.function_name, 
                                                        functionArgs.function_arguments
                                                    );
                                                    break;
                                                case '_meiliAppendConversationMessage':
                                                    console.log('Handling _meiliAppendConversationMessage tool call');
                                                    response = handleMeiliAppendConversationMessage(
                                                        functionArgs.role,
                                                        functionArgs.content,
                                                        functionArgs.tool_calls,
                                                        functionArgs.tool_call_id
                                                    );
                                                    break;
                                                case '_meiliSearchSources':
                                                    console.log('Handling _meiliSearchSources tool call');
                                                    response = handleMeiliSearchSources(
                                                        functionArgs.call_id,
                                                        functionArgs.sources || functionArgs.documents
                                                    );
                                                    break;
                                                case '_meiliReportError':
                                                    console.log('Handling _meiliReportError tool call');
                                                    response = handleMeiliReportError(
                                                        functionArgs.error_code,
                                                        functionArgs.message
                                                    );
                                                    break;
                                                default:
                                                    console.warn('Unknown Meilisearch tool call:', toolCallData.function.name);
                                                    response = { error: 'Unknown tool' };
                                            }
                                            
                                            // Store the response
                                            if (activeToolCalls[toolCallId]) {
                                                activeToolCalls[toolCallId].response = response;
                                            }
                                        }
                                        
                                        // Skip creating the default search indicator for Meilisearch tools that handle their own UI
                                        if (skipDefaultIndicator) {
                                            continue;
                                        }
                                        
                                        // Create the search indicator element for non-Meilisearch tools
                                        // or Meilisearch tools other than _meiliSearchProgress
                                        const searchIndicatorRow = document.createElement('div');
                                        searchIndicatorRow.className = 'message-row';
                                        searchIndicatorRow.dataset.toolCallId = toolCallId || 'default'; // Store the tool_call_id

                                        const searchIndicatorContainer = document.createElement('div');
                                        searchIndicatorContainer.className = 'search-indicator-container';

                                        const searchPulse = document.createElement('div');
                                        searchPulse.className = 'search-pulse';

                                        const searchInfo = document.createElement('div');
                                        searchInfo.className = 'search-info';

                                        // Get function name and arguments
                                        const functionName = toolCallData.function.name || 'unknown';
                                        const functionArgs = toolCallData.function.arguments ?
                                            (typeof toolCallData.function.arguments === 'string' ?
                                                JSON.parse(toolCallData.function.arguments) :
                                                toolCallData.function.arguments) :
                                            {};

                                        // Create search text and params
                                        const searchText = document.createElement('div');
                                        searchText.className = 'search-text';

                                        // Try to extract the most relevant info from args
                                        let displayText = '';
                                        try {
                                            if (functionArgs.q) {
                                                displayText = `"${functionArgs.q}"`;
                                            } else if (functionArgs.query) {
                                                displayText = `"${functionArgs.query}"`;
                                            } else if (Object.keys(functionArgs).length > 0) {
                                                // Just display the first argument for simplicity
                                                const firstKey = Object.keys(functionArgs)[0];
                                                const value = functionArgs[firstKey];
                                                if (typeof value === 'string') {
                                                    displayText = `${firstKey}: "${value}"`;
                                                } else {
                                                    displayText = `${firstKey}: ${JSON.stringify(value).substring(0, 50)}`;
                                                }
                                            }
                                        } catch (e) {
                                            displayText = '';
                                            console.error('Error formatting function args:', e);
                                        }

                                        searchText.textContent = `Running ${functionName}${displayText ? ' with ' + displayText : ''}`;

                                        const searchParams = document.createElement('div');
                                        searchParams.className = 'search-params';
                                        searchParams.textContent = `Tool ID: ${toolCallId || 'default'}`;

                                        // Assemble the indicator
                                        searchInfo.appendChild(searchText);
                                        searchInfo.appendChild(searchParams);
                                        searchIndicatorContainer.appendChild(searchPulse);
                                        searchIndicatorContainer.appendChild(searchInfo);
                                        searchIndicatorRow.appendChild(searchIndicatorContainer);

                                        // Insert search indicator before assistant message
                                        if (messageRow.parentNode) {
                                            chatContainer.insertBefore(searchIndicatorRow, messageRow);
                                        } else {
                                            chatContainer.appendChild(searchIndicatorRow);
                                        }

                                        // Store query information in the indicator for later retrieval
                                        let queryInfo = '';
                                        if (functionArgs.q) {
                                            queryInfo = functionArgs.q;
                                        } else if (functionArgs.query) {
                                            queryInfo = functionArgs.query;
                                        } else if (Object.keys(functionArgs).length > 0) {
                                            // Just get the first argument
                                            const firstKey = Object.keys(functionArgs)[0];
                                            if (typeof functionArgs[firstKey] === 'string') {
                                                queryInfo = functionArgs[firstKey];
                                            }
                                        }
                                        searchIndicatorRow.dataset.queryInfo = queryInfo;

                                        // Store this search indicator
                                        searchIndicators.push(searchIndicatorRow);
                                        toolCalls[toolCallId || 'default'] = searchIndicatorRow;

                                        // Only scroll if user is already at the bottom
                                        if (isScrolledToBottom()) {
                                            window.scrollTo(0, document.body.scrollHeight);
                                        }
                                    }
                                    // Handle tool output
                                    else if (parsedData.object === "chat.completion.tool.output" ||
                                             (parsedData.choices &&
                                              parsedData.choices[0] &&
                                              parsedData.choices[0].delta &&
                                              parsedData.choices[0].delta.tool_call_id)) {

                                        logDebug('Processing tool output', parsedData);
                                        // Don't create a new row if we have a search indicator, transform it instead
                                        let toolMessageRow, toolMessageDiv;

                                        // Find the corresponding search indicator for this tool_call_id
                                        // Fallback: if no tool_call_id is provided, use the most recent indicator
                                        const toolCallId = parsedData.tool_call_id ||
                                                           (parsedData.choices && parsedData.choices[0] &&
                                                            parsedData.choices[0].delta &&
                                                            parsedData.choices[0].delta.tool_call_id) ||
                                                           'default';

                                        const correspondingIndicator = toolCalls[toolCallId] ||
                                                                      (searchIndicators.length > 0 ?
                                                                       searchIndicators[searchIndicators.length - 1] :
                                                                       (searchIndicatorRow ? searchIndicatorRow : null));

                                        logDebug("Looking for indicator with ID:", toolCallId, "Found:", !!correspondingIndicator);

                                        if (correspondingIndicator && correspondingIndicator.parentNode) {
                                            // Transform the search indicator into results container
                                            toolMessageRow = correspondingIndicator;
                                            toolMessageRow.className = 'message-row tool-message';

                                            // Clear the existing content
                                            toolMessageRow.innerHTML = '';

                                            // Create new message div
                                            toolMessageDiv = document.createElement('div');
                                            toolMessageDiv.className = 'message-content';
                                            toolMessageRow.appendChild(toolMessageDiv);

                                            // Remove this indicator from our tracking
                                            delete toolCalls[toolCallId];
                                            searchIndicators = searchIndicators.filter(indicator => indicator !== correspondingIndicator);
                                        } else {
                                            // Create a new row if we don't have a search indicator
                                            toolMessageRow = document.createElement('div');
                                            toolMessageRow.className = 'message-row tool-message';

                                            toolMessageDiv = document.createElement('div');
                                            toolMessageDiv.className = 'message-content';
                                            toolMessageRow.appendChild(toolMessageDiv);

                                            // Add to chat container
                                            chatContainer.appendChild(toolMessageRow);
                                        }

                                        // Format the tool content
                                        let toolContent = '';
                                        if (parsedData.object === "chat.completion.tool.output") {
                                            toolContent = parsedData.tool?.content || '';
                                            
                                            // Intercept Meilisearch tool output
                                            if (toolCallId) {
                                                console.log(`Intercepted tool output for ID: ${toolCallId}`);
                                                console.log('Tool output content:', toolContent);
                                            
                                                // If this is a response to one of our tracked tool calls
                                                if (useMeiliToolsForUI && activeToolCalls[toolCallId]) {
                                                    const toolCall = activeToolCalls[toolCallId];
                                                    console.log(`This is a response to ${toolCall.name}`);
                                                    console.log('Original args:', toolCall.args);
                                                    console.log('Our response:', toolCall.response);
                                                
                                                    // If this is a response to a _meiliSearchProgress call,
                                                    // update or remove the corresponding indicator
                                                    if (toolCall.name === '_meiliSearchProgress') {
                                                        // Find the search indicator for this call
                                                        const callId = toolCall.args.call_id;
                                                        if (callId) {
                                                            const indicator = document.querySelector(`[data-meili-call-id="${callId}"]`);
                                                            if (indicator && indicator.parentNode) {
                                                                // Rather than removing, we'll just mark it as no longer active
                                                                delete searchProgressIndicators[callId];
                                                                
                                                                // Keep the indicator in the DOM for now,
                                                                // it will be transformed when sources arrive
                                                                const searchText = indicator.querySelector('.search-text');
                                                                if (searchText) {
                                                                    searchText.textContent = 'Search completed, waiting for results...';
                                                                }
                                                            }
                                                        }
                                                    }
                                                
                                                    // Clean up after processing
                                                    delete activeToolCalls[toolCallId];
                                                }
                                            }
                                        } else if (parsedData.choices && parsedData.choices[0] && parsedData.choices[0].delta) {
                                            toolContent = parsedData.choices[0].delta.content || '';
                                            if (parsedData.choices[0].delta.function_call && parsedData.choices[0].delta.function_call.arguments) {
                                                toolContent = parsedData.choices[0].delta.function_call.arguments;
                                            }
                                        }
                                        logDebug('Tool content', toolContent);

                                        // Create a container for results with collapsible content
                                        const toolResults = document.createElement('div');
                                        toolResults.className = 'tool-results';

                                        // Create the header
                                        const toolHeader = document.createElement('h4');
                                        toolHeader.className = 'collapsed';

                                        // Get the original search query if available from the indicator
                                        let queryText = '';
                                        if (correspondingIndicator && correspondingIndicator.dataset && correspondingIndicator.dataset.queryInfo) {
                                            queryText = correspondingIndicator.dataset.queryInfo;
                                        }

                                        toolHeader.textContent = queryText ? `Search results: "${queryText}"` : 'Search results';

                                        toolResults.appendChild(toolHeader);

                                        // Create the content container (collapsed by default)
                                        const toolResultsContent = document.createElement('div');
                                        toolResultsContent.className = 'tool-results-content';

                                        // Split by newlines and format as a list
                                        const movieResults = toolContent.split('\n').filter(item => item.trim() !== '');

                                        // Check if content is long enough to process
                                        if (movieResults.length > 0) {
                                            for (const movie of movieResults) {
